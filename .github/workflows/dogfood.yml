name: dogfood

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  dogfood-build-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        # Pinned to an exact version (not the floating @2 tag) so a silent Claude Code
        # release cannot change --bare/--plugin-dir or model behavior and break the
        # dogfood with no repo change. 2.1.198 is validated against this harness
        # (plugin loads under --bare --plugin-dir; /roughly:help resolves). Bump
        # deliberately after re-validating scripts/ci-dogfood.sh against the new version.
        run: npm install -g @anthropic-ai/claude-code@2.1.198 && claude --version

      # Budget / wall-time envelope (E06.S3 AC5):
      # - Each claude dispatch uses --max-budget-usd 1.50 (the AC2 plan-revision
      #   recovery scenario may need 1.50→2.00 if per-fixture validation shows a
      #   breach; final value tracked in CHANGELOG).
      # - The suite now runs 5 review-plan-bearing build dispatches: the build
      #   happy-path's newly-real review-plan dispatch (build --ci now runs
      #   review-plan per ADR-013) + 4 new fixtures (build-abort,
      #   build-abort-control, plan-revision, plan-clean).
      # - Each build dispatch is capped at $TIMEOUT 270s; the build-abort
      #   scenario aborts early (Stage 5c), so it typically returns well under
      #   the cap.
      # - Wall-time: added scenarios extend the run by roughly the sum of their
      #   dispatch times; the negative-path Risk-3 close criterion requires 3
      #   consecutive green runs on main.
      - name: "Run dogfood scaffolding (smoke + build + fix + negative-path: build-abort + plan-revision + controls)"
        run: bash scripts/ci-dogfood.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Verify auth failure mode (no hang)
        env:
          ANTHROPIC_API_KEY: invalid-key-xyz
        run: |
          set -uo pipefail
          OUT="$(timeout 30 claude --bare --plugin-dir "$GITHUB_WORKSPACE" --no-session-persistence -p "respond with ok" 2>&1)" && EXIT=0 || EXIT=$?
          if [ "$EXIT" = 124 ]; then
            echo "::error::auth-failure test FAILED — claude timed out (hang regression?)"
            exit 1
          fi
          if [ "$EXIT" = 0 ]; then
            echo "::error::auth-failure test FAILED — claude succeeded with invalid key"
            exit 1
          fi
          if ! grep -qE "Invalid API key|Not logged in" <<< "$OUT"; then
            echo "::error::auth-failure test FAILED — expected 'Invalid API key' or 'Not logged in' in output"
            printf '%s\n' "$OUT"
            exit 1
          fi
          MATCH="$(grep -E "Invalid API key|Not logged in" <<< "$OUT" | head -1)"
          echo "auth-failure test PASSED — clean error (no hang): $MATCH"
